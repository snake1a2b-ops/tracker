<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שליחת מיקום להורים</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #f0f2f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        h1 { color: #333; font-size: 24px; }
        p { color: #666; font-size: 16px; margin-bottom: 25px; }
        .status { font-weight: bold; color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h1>איתור מיקום</h1>
    <p>מיד תיפתח בקשה לאישור מיקום. <br><strong>חובה ללחוץ על "אישור" (Allow)</strong> כדי שההורים יקבלו את המיקום שלך.</p>
    <div id="status" class="status">מבקש גישה ל-GPS...</div>
</div>

<script>
    // הגדרות טלגרם - החליפו בפרטים שלכם
const TELEGRAM_TOKEN = '8573992916:AAHFZye_BN7FwKRUJHS24D4pw99v9dwnG6A';
const CHAT_ID = '8714686528';

    window.onload = function() {
        if (navigator.geolocation) {
            // בקשת מיקום בדיוק גבוה
            navigator.geolocation.getCurrentPosition(sendLocation, showError, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        } else {
            updateStatus("הדפדפן שלך לא תומך בשליחת מיקום.");
        }
    };

    function sendLocation(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const accuracy = position.coords.accuracy;
        
        updateStatus("המיקום אותר! שולח להורים...");

        // יצירת קישור ישיר ל-Google Maps
        const mapsLink = `https://google.com{lat},${lon}`;
        const message = `🚨 הילד פתח את הקישור!\n📍 מיקום: ${mapsLink}\n🎯 רמת דיוק: ${Math.round(accuracy)} מטרים.`;

        // שליחת המיקום לבוט בטלגרם
        fetch(`https://telegram.org{TELEGRAM_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message
            })
        })
        .then(response => {
            if(response.ok) {
                updateStatus("✅ המיקום נשלח בהצלחה להורים.");
            } else {
                updateStatus("שגיאה בשליחת המיקום.");
            }
        })
        .catch(err => {
            updateStatus("שגיאה בחיבור לשרת.");
        });
    }

    function showError(error) {
        switch(error.code) {
            case error.PERMISSION_DENIED:
                updateStatus("❌ שגיאה: יש לאשר גישה למיקום (GPS) כדי שהדף יעבוד.");
                break;
            case error.POSITION_UNAVAILABLE:
                updateStatus("❌ שגיאה: מיקום ה-GPS אינו זמין כרגע במכשיר.");
                break;
            case error.TIMEOUT:
                updateStatus("❌ שגיאה: הזמן לבקשת המיקום עבר.");
                break;
            default:
                updateStatus("❌ התרחשה שגיאה בלתי צפויה.");
                break;
        }
    }

    function updateStatus(text) {
        document.getElementById('status').innerText = text;
    }
</script>

</body>
</html>
